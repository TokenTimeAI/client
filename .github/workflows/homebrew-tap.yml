name: Publish Homebrew Tap

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to publish the Homebrew formula for (e.g., v0.1.9)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  homebrew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.version }}

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          install-only: true

      - name: Generate Homebrew formula
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean --skip=publish --skip=validate --skip=announce

      - name: Push formula to tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "${TAP_GITHUB_TOKEN}" ]; then
            echo "TAP_GITHUB_TOKEN must be configured to publish the Homebrew tap"
            exit 1
          fi

          tag="${{ github.event.inputs.version }}"
          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/tokentimeai/homebrew-tap.git" /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Formula
          cp dist/homebrew/Formula/ttime.rb /tmp/homebrew-tap/Formula/ttime.rb
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ttime.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date for ${tag}"
            exit 0
          fi
          git commit -m "Brew formula update for ttime version ${tag}"
          git push origin main
